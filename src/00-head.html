<title>C-V2X Uu Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A game that teaches the C-V2X Uu interface: architecture, protocol stack, LTE/NR physical layer, procedures, QoS, scheduling, MBMS, mobility, security and Uu control of PC5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: an interstate route map. The course is a highway and every lesson is an exit sign;
   inside an exit a sticky stage rail drives Briefing -> Challenge -> Checkpoint -> Result. */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#13201a; --ink-2:#43554c; --ink-3:#687b71;
  --line:#d3ddd7; --line-2:#b5c4bb;
  --accent:#0a6847; --sign:#0b6b4a; --sign-2:#08583c; --on-sign:#ffffff;
  --amber:#865700; --amber-bg:#ffcf4a; --on-amber:#1c1500; --amber-soft:#fff4d2; --amber-line:#e9c76a;
  --blue:#1f4f8f; --blue-soft:#e5edf8; --violet:#6d43b8; --violet-soft:#efe8fa;
  --good:#1b7a3a; --good-soft:#e1f2e6; --bad:#b3261e; --bad-soft:#fbe6e3;
  --road:#2f3734; --lane:#f2c94c;
  --d-cp:#6d43b8; --d-up:#0a6847; --d-ul:#b8470f; --d-dl:#1f4f8f; --d-sl:#94620a;
  --shadow:0 1px 2px rgba(12,40,26,.07),0 8px 24px rgba(12,40,26,.07);
  --f-display:"Overpass","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1311; --surface:#141c19; --surface-2:#19231f; --ink:#e3ebe6; --ink-2:#a9b9b0; --ink-3:#80938a;
    --line:#26332d; --line-2:#3a4a42;
    --accent:#5fd0a0; --sign:#0f7552; --sign-2:#138a61; --on-sign:#ffffff;
    --amber:#f3c55a; --amber-bg:#f0c040; --on-amber:#1c1500; --amber-soft:#2a2411; --amber-line:#5c4b1c;
    --blue:#86b4f4; --blue-soft:#17243a; --violet:#c0a6f5; --violet-soft:#241c38;
    --good:#66d491; --good-soft:#132b1c; --bad:#ff8f84; --bad-soft:#3a1714;
    --road:#262e2b; --lane:#e2b73d;
    --d-cp:#c0a6f5; --d-up:#5fd0a0; --d-ul:#f59e5b; --d-dl:#86b4f4; --d-sl:#e7b54a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#141c19; --surface-2:#19231f; --ink:#e3ebe6; --ink-2:#a9b9b0; --ink-3:#80938a;
  --line:#26332d; --line-2:#3a4a42;
  --accent:#5fd0a0; --sign:#0f7552; --sign-2:#138a61; --on-sign:#ffffff;
  --amber:#f3c55a; --amber-bg:#f0c040; --on-amber:#1c1500; --amber-soft:#2a2411; --amber-line:#5c4b1c;
  --blue:#86b4f4; --blue-soft:#17243a; --violet:#c0a6f5; --violet-soft:#241c38;
  --good:#66d491; --good-soft:#132b1c; --bad:#ff8f84; --bad-soft:#3a1714;
  --road:#262e2b; --lane:#e2b73d;
  --d-cp:#c0a6f5; --d-up:#5fd0a0; --d-ul:#f59e5b; --d-dl:#86b4f4; --d-sl:#e7b54a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.58;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;color:var(--ink)}
h2{font-size:clamp(1.55rem,1.15rem + 1.3vw,2.15rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.18rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.9em}
sub,sup{line-height:0}
:focus-visible{outline:3px solid var(--amber-bg);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.eyebrow{font-family:var(--f-display);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-display);font-weight:700;font-size:1rem;background:var(--sign);color:var(--on-sign);border:2px solid var(--sign);
  border-radius:8px;padding:.55em 1.05em .45em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1.2}
.btn:hover{background:var(--sign-2);border-color:var(--sign-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:.88rem;padding:.4em .8em .32em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

/* ---------- glossary term ---------- */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;border-bottom:1.5px dotted var(--accent);cursor:help;line-height:inherit;text-align:inherit}
.term:hover{color:var(--accent)}
.pop{position:absolute;z-index:60;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.pop h4{font-size:1.05rem}
.pop .exp{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:.9rem}

/* ---------- map / hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;padding-block:28px 10px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.bigsign{background:var(--sign);color:var(--on-sign);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.bigsign-in{border:3px solid var(--on-sign);border-radius:13px;padding:20px clamp(18px,3vw,30px) 24px;display:flex;flex-direction:column;gap:12px;height:100%}
.bigsign .route-pill{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--on-sign);color:var(--sign);font-family:var(--f-display);
  font-weight:800;font-size:.86rem;letter-spacing:.06em;border-radius:6px;padding:4px 10px 2px}
.bigsign h1{color:var(--on-sign);font-size:clamp(2.7rem,1.4rem + 5vw,5.4rem);font-weight:900;letter-spacing:-.025em;line-height:.92}
.bigsign h1 span{display:block;font-size:.36em;letter-spacing:.02em;font-weight:700;opacity:.92;margin-bottom:.2em}
.bigsign p{font-size:1.06rem;max-width:52ch;color:var(--on-sign)}
.bigsign .arrows{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:.95rem;margin-top:4px}
.bigsign .arrows span{display:inline-flex;align-items:center;gap:6px}
.tripcomp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.tripcomp .gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gauge b{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.gauge b small{font-size:.6em;color:var(--ink-3)}
.gauge span{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-display);font-weight:700}
.rankline{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rankline strong{font-family:var(--f-display);font-size:1.15rem}
.meter{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.map-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-block:18px}
@media (max-width:980px){.map-body{grid-template-columns:minmax(0,1fr)}}
.route{position:relative;display:flex;flex-direction:column;gap:16px;padding:6px 0 6px 62px;min-width:0}
.route::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:36px;background:var(--road);border-radius:8px}
.route::after{content:"";position:absolute;left:27px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(to bottom,var(--lane) 0 16px,transparent 16px 32px)}
.xrow{position:relative;display:block}
.xrow::before{content:"";position:absolute;left:-16px;top:38px;width:16px;height:4px;background:var(--road)}
.xsign{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;background:var(--sign);color:var(--on-sign);
  border-radius:12px;padding:4px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease}
.xsign-in{grid-column:1/-1;border:2.5px solid var(--on-sign);border-radius:9px;padding:16px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
a.xsign:hover{transform:translateX(4px)}
.xtab{position:absolute;top:-13px;right:18px;background:var(--sign);color:var(--on-sign);border:2.5px solid var(--on-sign);outline:4px solid var(--sign);
  border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.08em;padding:3px 9px 1px;line-height:1.3}
.xtitle{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.1;color:var(--on-sign);letter-spacing:-.005em}
.xsub{grid-column:1/2;font-size:1rem;opacity:.95}
.xtopics{grid-column:1/-1;font-family:var(--f-mono);font-size:.78rem;opacity:.85;margin-top:6px}
.xstars{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-family:var(--f-display);font-weight:700;font-size:.85rem;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stars{letter-spacing:2px;font-size:1.15rem;line-height:1}
.stars .on{color:var(--amber-bg)}
.stars .off{opacity:.35}
.xsign.locked{background:var(--surface-2);color:var(--ink-3);box-shadow:none;border:1px dashed var(--line-2)}
.xsign.locked .xsign-in{border-color:var(--line-2)}
.xsign.locked .xtitle,.xsign.locked .xsub{color:var(--ink-3)}
.xsign.locked .xtab{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-2);outline-color:var(--bg)}
.xsign.final{background:var(--blue)}
.xsign.final .xtab{background:var(--blue);outline-color:var(--blue)}
:root .xsign.final{background:#1f4f8f}
:root .xsign.final .xtab{background:#1f4f8f;outline-color:#1f4f8f}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel ol,.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;gap:8px;align-items:center;font-size:.9rem}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid var(--line-2)}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:.95rem}
.toggle input{width:18px;height:18px;accent-color:var(--sign)}
.confirm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- player ---------- */
.p-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.p-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.p-row .back{font-family:var(--f-display);font-weight:700;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.p-row .back:hover{color:var(--accent)}
.minisign{display:inline-flex;align-items:center;gap:10px;background:var(--sign);color:var(--on-sign);border-radius:8px;padding:3px;min-width:0}
.minisign-in{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--on-sign);border-radius:6px;padding:3px 10px 1px;min-width:0}
.minisign b{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
.minisign span{font-family:var(--f-display);font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .spacer{flex:1}
.glossbtn{white-space:nowrap}
.rail{list-style:none;margin:0;padding:0;display:flex;gap:4px;align-items:center}
.rail li{flex:1;min-width:0}
.rail-seg{display:block;width:100%;height:10px;border-radius:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.rail-seg.k-challenge{background:var(--amber-line)}
.rail-seg.k-quiz,.rail-seg.k-result{background:var(--line-2)}
.rail-seg.done{background:var(--accent)}
.rail-seg.k-challenge.done{background:var(--amber)}
.rail-seg.cur{outline:2px solid var(--ink);outline-offset:2px}
.rail-meta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--ink-2);font-family:var(--f-display);font-weight:600;flex-wrap:wrap}
.stage{padding-block:22px}
.p-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 0}
.p-nav .count{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-3)}

/* ---------- briefing card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,34px);display:flex;flex-direction:column;gap:20px}
.card-head{display:flex;flex-direction:column;gap:8px}
.card-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(18px,3vw,34px);align-items:start}
.card.wide .card-grid{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.card-grid{grid-template-columns:minmax(0,1fr)}}
.prose{display:flex;flex-direction:column;gap:.85em;max-width:70ch;min-width:0}
.prose ul,.prose ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:.35em}
.prose li::marker{color:var(--accent)}
.lead{font-size:1.12rem;color:var(--ink)}
.fig{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.86rem;color:var(--ink-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll-x > svg{width:auto;max-width:none}
.takeaway{display:flex;gap:14px;align-items:flex-start;background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:12px;padding:12px 16px}
.diamond{width:20px;height:20px;background:var(--amber-bg);transform:rotate(45deg);border:2px solid var(--on-amber);border-radius:3px;flex:none;margin:7px 4px 0}
.takeaway strong{font-family:var(--f-display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.takeaway p{margin-top:2px}
.deep{border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.deep summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:700;color:var(--ink);list-style:none;display:flex;align-items:center;gap:10px}
.deep summary::-webkit-details-marker{display:none}
.deep summary::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
.deep[open] summary::before{transform:rotate(45deg)}
.deep-body{padding:2px 18px 16px;display:flex;flex-direction:column;gap:.8em;max-width:78ch}
.deep-body ul,.deep-body ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:.3em}
.specs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}
.specs > span:first-child{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.spec{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.formula{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.9rem;white-space:nowrap}
.miles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-left:4px solid var(--road);margin-left:8px}
.miles li{position:relative;padding:4px 0 12px 18px}
.miles li::before{content:"";position:absolute;left:-10px;top:8px;width:12px;height:12px;border-radius:2px;background:var(--sign);border:2px solid var(--surface-2)}
.miles b{font-family:var(--f-display);font-weight:800}
.analogy{border-left:4px solid var(--blue);padding:4px 0 4px 14px;color:var(--ink-2);font-style:italic}

/* ---------- svg diagram tokens ---------- */
.dg text{font-family:var(--f-display);fill:var(--ink)}
.dg .t-sm{font-size:11px;font-weight:600}
.dg .t-md{font-size:13px;font-weight:700}
.dg .t-lg{font-size:15px;font-weight:800}
.dg .t-mono{font-family:var(--f-mono);font-size:10.5px}
.dg .t-mute{fill:var(--ink-2)}
.dg .t-acc{fill:var(--accent)}
.dg .t-on{fill:var(--on-sign)}
.dg .box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.dg .box.ue{fill:var(--blue-soft);stroke:var(--blue)}
.dg .box.ran{fill:var(--good-soft);stroke:var(--accent)}
.dg .box.core{fill:var(--surface);stroke:var(--ink-3)}
.dg .box.v2x{fill:var(--amber-soft);stroke:var(--amber)}
.dg .box.mbms{fill:var(--violet-soft);stroke:var(--violet)}
.dg .box.sign{fill:var(--sign);stroke:var(--sign)}
.dg .box.hl{stroke-width:3}
.dg .ln{stroke:var(--ink-3);stroke-width:2;fill:none}
.dg .ln.up{stroke:var(--d-up)}
.dg .ln.cp{stroke:var(--d-cp);stroke-dasharray:6 4}
.dg .ln.lg{stroke:var(--amber);stroke-dasharray:2 5;stroke-linecap:round;stroke-width:2.5}
.dg .ln.ul{stroke:var(--d-ul)} .dg .ln.dl{stroke:var(--d-dl)} .dg .ln.sl{stroke:var(--d-sl)}
.dg .ln.thin{stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:4 4}
.dg .ah{fill:var(--ink-3)} .dg .ah.up{fill:var(--d-up)} .dg .ah.cp{fill:var(--d-cp)} .dg .ah.ul{fill:var(--d-ul)} .dg .ah.dl{fill:var(--d-dl)} .dg .ah.sl{fill:var(--d-sl)} .dg .ah.lg{fill:var(--amber)}
.dg .fill-ul{fill:var(--d-ul)} .dg .fill-dl{fill:var(--d-dl)} .dg .fill-up{fill:var(--d-up)} .dg .fill-cp{fill:var(--d-cp)} .dg .fill-sl{fill:var(--d-sl)}
.dg .fill-amber{fill:var(--amber-bg)} .dg .fill-road{fill:var(--road)} .dg .fill-lane{fill:var(--lane)} .dg .fill-surf{fill:var(--surface)} .dg .fill-surf2{fill:var(--surface-2)}
.dg .fill-ink{fill:var(--ink)} .dg .fill-mute{fill:var(--ink-3)} .dg .fill-line{fill:var(--line)} .dg .fill-sign{fill:var(--sign)} .dg .fill-blue{fill:var(--blue)} .dg .fill-good{fill:var(--good)} .dg .fill-bad{fill:var(--bad)}
