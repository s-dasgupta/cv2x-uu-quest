<div id="app" aria-live="off"></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Glossary">
  <div class="drawer-head">
    <h3>Glossary</h3>
    <button type="button" class="btn ghost sm" data-act="close-glossary">Close</button>
  </div>
  <input type="search" id="gl-search" placeholder="Search terms, e.g. HARQ, MB2, QCI" autocomplete="off">
  <div class="gl-list" id="gl-list"></div>
</aside>
<div id="pop" class="pop" hidden role="dialog" aria-label="Term definition"></div>
<div id="toast" class="toast" hidden role="status"></div>
