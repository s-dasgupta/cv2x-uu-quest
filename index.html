<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b4a">
<meta property="og:title" content="C-V2X Uu Quest">
<meta property="og:description" content="A free browser game that teaches the C-V2X Uu interface: architecture, protocol stack, LTE/NR radio, procedures, QoS, scheduling and latency, broadcast, handover, security and Uu control of the sidelink.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='12' fill='%230b6b4a'/%3E%3Crect x='8' y='8' width='48' height='48' rx='8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='700' fill='%23fff' text-anchor='middle'%3EUu%3C/text%3E%3C/svg%3E">
<title>C-V2X Uu Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A game that teaches the C-V2X Uu interface: architecture, protocol stack, LTE/NR physical layer, procedures, QoS, scheduling, MBMS, mobility, security and Uu control of PC5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: an interstate route map. The course is a highway and every lesson is an exit sign;
   inside an exit a sticky stage rail drives Briefing -> Challenge -> Checkpoint -> Result. */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#13201a; --ink-2:#43554c; --ink-3:#687b71;
  --line:#d3ddd7; --line-2:#b5c4bb;
  --accent:#0a6847; --sign:#0b6b4a; --sign-2:#08583c; --on-sign:#ffffff;
  --amber:#865700; --amber-bg:#ffcf4a; --on-amber:#1c1500; --amber-soft:#fff4d2; --amber-line:#e9c76a;
  --blue:#1f4f8f; --blue-soft:#e5edf8; --violet:#6d43b8; --violet-soft:#efe8fa;
  --good:#1b7a3a; --good-soft:#e1f2e6; --bad:#b3261e; --bad-soft:#fbe6e3;
  --road:#2f3734; --lane:#f2c94c;
  --d-cp:#6d43b8; --d-up:#0a6847; --d-ul:#b8470f; --d-dl:#1f4f8f; --d-sl:#94620a;
  --shadow:0 1px 2px rgba(12,40,26,.07),0 8px 24px rgba(12,40,26,.07);
  --f-display:"Overpass","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1311; --surface:#141c19; --surface-2:#19231f; --ink:#e3ebe6; --ink-2:#a9b9b0; --ink-3:#80938a;
    --line:#26332d; --line-2:#3a4a42;
    --accent:#5fd0a0; --sign:#0f7552; --sign-2:#138a61; --on-sign:#ffffff;
    --amber:#f3c55a; --amber-bg:#f0c040; --on-amber:#1c1500; --amber-soft:#2a2411; --amber-line:#5c4b1c;
    --blue:#86b4f4; --blue-soft:#17243a; --violet:#c0a6f5; --violet-soft:#241c38;
    --good:#66d491; --good-soft:#132b1c; --bad:#ff8f84; --bad-soft:#3a1714;
    --road:#262e2b; --lane:#e2b73d;
    --d-cp:#c0a6f5; --d-up:#5fd0a0; --d-ul:#f59e5b; --d-dl:#86b4f4; --d-sl:#e7b54a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#141c19; --surface-2:#19231f; --ink:#e3ebe6; --ink-2:#a9b9b0; --ink-3:#80938a;
  --line:#26332d; --line-2:#3a4a42;
  --accent:#5fd0a0; --sign:#0f7552; --sign-2:#138a61; --on-sign:#ffffff;
  --amber:#f3c55a; --amber-bg:#f0c040; --on-amber:#1c1500; --amber-soft:#2a2411; --amber-line:#5c4b1c;
  --blue:#86b4f4; --blue-soft:#17243a; --violet:#c0a6f5; --violet-soft:#241c38;
  --good:#66d491; --good-soft:#132b1c; --bad:#ff8f84; --bad-soft:#3a1714;
  --road:#262e2b; --lane:#e2b73d;
  --d-cp:#c0a6f5; --d-up:#5fd0a0; --d-ul:#f59e5b; --d-dl:#86b4f4; --d-sl:#e7b54a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.58;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;color:var(--ink)}
h2{font-size:clamp(1.55rem,1.15rem + 1.3vw,2.15rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.18rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.9em}
sub,sup{line-height:0}
:focus-visible{outline:3px solid var(--amber-bg);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.eyebrow{font-family:var(--f-display);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-display);font-weight:700;font-size:1rem;background:var(--sign);color:var(--on-sign);border:2px solid var(--sign);
  border-radius:8px;padding:.55em 1.05em .45em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1.2}
.btn:hover{background:var(--sign-2);border-color:var(--sign-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:.88rem;padding:.4em .8em .32em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

/* ---------- glossary term ---------- */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;border-bottom:1.5px dotted var(--accent);cursor:help;line-height:inherit;text-align:inherit}
.term:hover{color:var(--accent)}
.pop{position:absolute;z-index:60;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.pop h4{font-size:1.05rem}
.pop .exp{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:.9rem}

/* ---------- map / hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;padding-block:28px 10px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.bigsign{background:var(--sign);color:var(--on-sign);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.bigsign-in{border:3px solid var(--on-sign);border-radius:13px;padding:20px clamp(18px,3vw,30px) 24px;display:flex;flex-direction:column;gap:12px;height:100%}
.bigsign .route-pill{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--on-sign);color:var(--sign);font-family:var(--f-display);
  font-weight:800;font-size:.86rem;letter-spacing:.06em;border-radius:6px;padding:4px 10px 2px}
.bigsign h1{color:var(--on-sign);font-size:clamp(2.7rem,1.4rem + 5vw,5.4rem);font-weight:900;letter-spacing:-.025em;line-height:.92}
.bigsign h1 span{display:block;font-size:.36em;letter-spacing:.02em;font-weight:700;opacity:.92;margin-bottom:.2em}
.bigsign p{font-size:1.06rem;max-width:52ch;color:var(--on-sign)}
.bigsign .arrows{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:.95rem;margin-top:4px}
.bigsign .arrows span{display:inline-flex;align-items:center;gap:6px}
.tripcomp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.tripcomp .gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gauge b{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.gauge b small{font-size:.6em;color:var(--ink-3)}
.gauge span{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-display);font-weight:700}
.rankline{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rankline strong{font-family:var(--f-display);font-size:1.15rem}
.meter{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.map-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-block:18px}
@media (max-width:980px){.map-body{grid-template-columns:minmax(0,1fr)}}
.route{position:relative;display:flex;flex-direction:column;gap:16px;padding:6px 0 6px 62px;min-width:0}
.route::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:36px;background:var(--road);border-radius:8px}
.route::after{content:"";position:absolute;left:27px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(to bottom,var(--lane) 0 16px,transparent 16px 32px)}
.xrow{position:relative;display:block}
.xrow::before{content:"";position:absolute;left:-16px;top:38px;width:16px;height:4px;background:var(--road)}
.xsign{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;background:var(--sign);color:var(--on-sign);
  border-radius:12px;padding:4px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease}
.xsign-in{grid-column:1/-1;border:2.5px solid var(--on-sign);border-radius:9px;padding:16px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
a.xsign:hover{transform:translateX(4px)}
.xtab{position:absolute;top:-13px;right:18px;background:var(--sign);color:var(--on-sign);border:2.5px solid var(--on-sign);outline:4px solid var(--sign);
  border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.08em;padding:3px 9px 1px;line-height:1.3}
.xtitle{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.1;color:var(--on-sign);letter-spacing:-.005em}
.xsub{grid-column:1/2;font-size:1rem;opacity:.95}
.xtopics{grid-column:1/-1;font-family:var(--f-mono);font-size:.78rem;opacity:.85;margin-top:6px}
.xstars{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-family:var(--f-display);font-weight:700;font-size:.85rem;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stars{letter-spacing:2px;font-size:1.15rem;line-height:1}
.stars .on{color:var(--amber-bg)}
.stars .off{opacity:.35}
.xsign.locked{background:var(--surface-2);color:var(--ink-3);box-shadow:none;border:1px dashed var(--line-2)}
.xsign.locked .xsign-in{border-color:var(--line-2)}
.xsign.locked .xtitle,.xsign.locked .xsub{color:var(--ink-3)}
.xsign.locked .xtab{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-2);outline-color:var(--bg)}
.xsign.final{background:var(--blue)}
.xsign.final .xtab{background:var(--blue);outline-color:var(--blue)}
:root .xsign.final{background:#1f4f8f}
:root .xsign.final .xtab{background:#1f4f8f;outline-color:#1f4f8f}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel ol,.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;gap:8px;align-items:center;font-size:.9rem}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid var(--line-2)}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:.95rem}
.toggle input{width:18px;height:18px;accent-color:var(--sign)}
.confirm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- player ---------- */
.p-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.p-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.p-row .back{font-family:var(--f-display);font-weight:700;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.p-row .back:hover{color:var(--accent)}
.minisign{display:inline-flex;align-items:center;gap:10px;background:var(--sign);color:var(--on-sign);border-radius:8px;padding:3px;min-width:0}
.minisign-in{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--on-sign);border-radius:6px;padding:3px 10px 1px;min-width:0}
.minisign b{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
.minisign span{font-family:var(--f-display);font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .spacer{flex:1}
.glossbtn{white-space:nowrap}
.rail{list-style:none;margin:0;padding:0;display:flex;gap:4px;align-items:center}
.rail li{flex:1;min-width:0}
.rail-seg{display:block;width:100%;height:10px;border-radius:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.rail-seg.k-challenge{background:var(--amber-line)}
.rail-seg.k-quiz,.rail-seg.k-result{background:var(--line-2)}
.rail-seg.done{background:var(--accent)}
.rail-seg.k-challenge.done{background:var(--amber)}
.rail-seg.cur{outline:2px solid var(--ink);outline-offset:2px}
.rail-meta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--ink-2);font-family:var(--f-display);font-weight:600;flex-wrap:wrap}
.stage{padding-block:22px}
.p-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 0}
.p-nav .count{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-3)}

/* ---------- briefing card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,34px);display:flex;flex-direction:column;gap:20px}
.card-head{display:flex;flex-direction:column;gap:8px}
.card-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(18px,3vw,34px);align-items:start}
.card.wide .card-grid{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.card-grid{grid-template-columns:minmax(0,1fr)}}
.prose{display:flex;flex-direction:column;gap:.85em;max-width:70ch;min-width:0}
.prose ul,.prose ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:.35em}
.prose li::marker{color:var(--accent)}
.lead{font-size:1.12rem;color:var(--ink)}
.fig{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.86rem;color:var(--ink-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll-x > svg{width:auto;max-width:none}
.takeaway{display:flex;gap:14px;align-items:flex-start;background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:12px;padding:12px 16px}
.diamond{width:20px;height:20px;background:var(--amber-bg);transform:rotate(45deg);border:2px solid var(--on-amber);border-radius:3px;flex:none;margin:7px 4px 0}
.takeaway strong{font-family:var(--f-display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.takeaway p{margin-top:2px}
.deep{border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.deep summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:700;color:var(--ink);list-style:none;display:flex;align-items:center;gap:10px}
.deep summary::-webkit-details-marker{display:none}
.deep summary::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
.deep[open] summary::before{transform:rotate(45deg)}
.deep-body{padding:2px 18px 16px;display:flex;flex-direction:column;gap:.8em;max-width:78ch}
.deep-body ul,.deep-body ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:.3em}
.specs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}
.specs > span:first-child{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.spec{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.formula{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.9rem;white-space:nowrap}
.miles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-left:4px solid var(--road);margin-left:8px}
.miles li{position:relative;padding:4px 0 12px 18px}
.miles li::before{content:"";position:absolute;left:-10px;top:8px;width:12px;height:12px;border-radius:2px;background:var(--sign);border:2px solid var(--surface-2)}
.miles b{font-family:var(--f-display);font-weight:800}
.analogy{border-left:4px solid var(--blue);padding:4px 0 4px 14px;color:var(--ink-2);font-style:italic}

/* ---------- svg diagram tokens ---------- */
.dg text{font-family:var(--f-display);fill:var(--ink)}
.dg .t-sm{font-size:11px;font-weight:600}
.dg .t-md{font-size:13px;font-weight:700}
.dg .t-lg{font-size:15px;font-weight:800}
.dg .t-mono{font-family:var(--f-mono);font-size:10.5px}
.dg .t-mute{fill:var(--ink-2)}
.dg .t-acc{fill:var(--accent)}
.dg .t-on{fill:var(--on-sign)}
.dg .box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.dg .box.ue{fill:var(--blue-soft);stroke:var(--blue)}
.dg .box.ran{fill:var(--good-soft);stroke:var(--accent)}
.dg .box.core{fill:var(--surface);stroke:var(--ink-3)}
.dg .box.v2x{fill:var(--amber-soft);stroke:var(--amber)}
.dg .box.mbms{fill:var(--violet-soft);stroke:var(--violet)}
.dg .box.sign{fill:var(--sign);stroke:var(--sign)}
.dg .box.hl{stroke-width:3}
.dg .ln{stroke:var(--ink-3);stroke-width:2;fill:none}
.dg .ln.up{stroke:var(--d-up)}
.dg .ln.cp{stroke:var(--d-cp);stroke-dasharray:6 4}
.dg .ln.lg{stroke:var(--amber);stroke-dasharray:2 5;stroke-linecap:round;stroke-width:2.5}
.dg .ln.ul{stroke:var(--d-ul)} .dg .ln.dl{stroke:var(--d-dl)} .dg .ln.sl{stroke:var(--d-sl)}
.dg .ln.thin{stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:4 4}

  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px;box-shadow:var(--shadow)}

<aside id="drawer" class="drawer" hidden aria-label="Glossary">

    <h3>Glossary</h3>
    <button type="button" class="btn ghost sm" data-act="close-glossary">Close</button>
  </div>
  <input type="search" id="gl-search" placeholder="Search terms, e.g. HARQ, MB2, QCI" autocomplete="off">
  <div class="gl-list" id="gl-list"></div>
</aside>
<div id="pop" class="pop" hidden role="dialog" aria-label="Term definition"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
(function () {
"use strict";
/* ============================================================
   Uu Quest — engine: utilities, progress store, glossary, router,
   route map, exit player, generic challenge types, diagram helpers.
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round = (v, d = 1) => Math.round(v * 10 ** d) / 10 ** d;
const EXITS = [];
const GAMES = {};
const MOUNTS = {};
let GLOSSARY = {};
function defineExit(e) { EXITS.push(e); }

/* [[KEY]] or [[KEY|label]] -> clickable glossary term */
const TERM_RE = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
function T(html) {
  if (html == null) return '';
  return String(html).replace(TERM_RE, (m, k, l) => `<button type="button" class="term" data-term="${esc(k)}">${l || k}</button>`);
}
function plain(html) { return html == null ? '' : String(html).replace(TERM_RE, (m, k, l) => l || k); }

/* ---------- progress store (per-browser convenience only) ---------- */
const STORE = 'cv2x-uu-quest/v1';
function blankProgress() { return { exits: {}, free: false, name: '' }; }
let P = blankProgress();
try { const raw = localStorage.getItem(STORE); if (raw) P = Object.assign(blankProgress(), JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) { /* ignore */ } }
function rec(id) { if (!P.exits[id]) P.exits[id] = { best: 0, stars: 0, parts: {} }; return P.exits[id]; }
function components(ex) {
  const list = (ex.challenges || []).map((c, i) => ({ key: 'c' + i, label: plain(c.title) }));
  if (ex.quiz && ex.quiz.length) list.push({ key: 'quiz', label: ex.final ? 'Final exam' : 'Checkpoint quiz' });
  return list;
}
function starsFor(s) { return s >= 0.9 ? 3 : s >= 0.75 ? 2 : s >= 0.5 ? 1 : 0; }
function recordPart(ex, key, score) {
  const r = rec(ex.id);
  r.parts[key] = Math.max(r.parts[key] || 0, score);
  const comps = components(ex);
  const total = comps.reduce((a, c) => a + (r.parts[c.key] || 0), 0) / comps.length;
  r.best = Math.max(r.best, total);
  r.stars = starsFor(r.best);
  save();

function isUnlocked(ex) {

/* ---------- exit player ---------- */
function buildStages(ex) {
  const s = [];
  (ex.cards || []).forEach((c, i) => s.push({ kind: 'card', i, label: 'Briefing ' + (i + 1) + ': ' + plain(c.title) }));
  (ex.challenges || []).forEach((c, i) => s.push({ kind: 'challenge', i, label: 'Challenge ' + (i + 1) + ': ' + plain(c.title) }));
  if (ex.quiz && ex.quiz.length) s.push({ kind: 'quiz', label: ex.final ? 'Final exam' : 'Checkpoint quiz' });
  s.push({ kind: 'result', label: 'Result' });
  return s;
}
function openExit(id, idx) {
  const ex = EXITS.find((e) => e.id === id);
  if (!ex) { location.hash = ''; return; }
  if (!isUnlocked(ex)) { location.hash = ''; toast('Clear the previous exit first, or switch on free roam.'); return; }
  const stages = buildStages(ex);
  if (idx == null) { const last = (P.exits[ex.id] || {}).last; idx = last != null && last < stages.length - 1 ? last : 0; }
  cur = { ex, stages, idx: clamp(idx, 0, stages.length - 1), visited: new Set() };
  document.title = (ex.final ? '' : 'Exit ' + ex.num + ' · ') + ex.title + ' · Uu Quest';
  renderPlayer();
  window.scrollTo(0, 0);
}
function stageDone(i) {
  const s = cur.stages[i]; const r = P.exits[cur.ex.id];
  if (s.kind === 'card') return cur.visited.has(i);
  if (s.kind === 'challenge') return !!(r && r.parts['c' + s.i] != null);
  if (s.kind === 'quiz') return !!(r && r.parts.quiz != null);
  return false;
}
function nextLabel() {
  const s = cur.stages[cur.idx];
  if ((s.kind === 'challenge' || s.kind === 'quiz') && !stageDone(cur.idx)) return 'Skip →';
  const n = cur.stages[cur.idx + 1];
  return n && n.kind === 'result' ? 'See result →' : 'Next →';
}
function go(i) { if (!cur) return; cur.idx = clamp(i, 0, cur.stages.length - 1); renderPlayer(); window.scrollTo(0, 0); }
function refreshNav() {
  if (!cur) return;
  const b = $('#nextbtn'); if (b) b.textContent = nextLabel();
  $$('.rail-seg').forEach((s, i) => s.classList.toggle('done', stageDone(i)));
  const r = P.exits[cur.ex.id]; const m = $('#rail-best');
  if (m && r) m.innerHTML = 'Best ' + Math.round(r.best * 100) + '% ' + starsHTML(r.stars);
}

      <div class="rail-meta"><span>${esc(st.label)}</span><span id="rail-best">${r && r.best > 0 ? 'Best ' + Math.round(r.best * 100) + '% ' + starsHTML(r.stars) : 'Not scored yet'}</span></div>

/* ---------- router & global events ---------- */
let pendingIdx = null;
function route() {
  const h = location.hash.replace(/^#/, '');
  const m = /^exit-(\d+)$/.exec(h);
  if (m) { const idx = pendingIdx; pendingIdx = null; openExit(+m[1], idx); }
  else { renderMap(); window.scrollTo(0, 0); }
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-go],.term');
  if (!t) { if (!e.target.closest('#pop')) closePop(); return; }
  if (t.classList.contains('term')) { e.preventDefault(); e.stopPropagation(); showPop(t); return; }
  if (t.dataset.go != null) { go(+t.dataset.go); return; }
  const a = t.dataset.act;
  if (a === 'next') go(cur.idx + 1);
  else if (a === 'prev') go(cur.idx - 1);
  else if (a === 'replay') renderPlayer();
  else if (a === 'glossary') openGlossary(t.dataset.q || '');
  else if (a === 'close-glossary') closeGlossary();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePop(); closeGlossary(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
  if (!cur || e.altKey || e.ctrlKey || e.metaKey) return;
  const st = cur.stages[cur.idx];
  if (st.kind !== 'card') return;
  if (e.key === 'ArrowRight') go(cur.idx + 1);
  if (e.key === 'ArrowLeft' && cur.idx > 0) go(cur.idx - 1);
});
$('#scrim').addEventListener('click', closeGlossary);
$('#gl-search').addEventListener('input', (e) => renderGlossary(e.target.value));
window.addEventListener('hashchange', route);
window.addEventListener('resize', closePop);

/* Sort items into bins, one at a time, with an explanation after each. */
GAMES.classify = function (host, cfg, api) {
  const items = shuffle(cfg.items.slice()); const n = items.length; let i = 0, right = 0; const log = [];
  const binLabel = (id) => plain((cfg.bins.find((b) => b.id === id) || {}).label || id);
  function show() {
    const it = items[i];
    host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
      <div class="g-progress"><span>Item ${i + 1} of ${n}</span><span id="cl-right">${right} correct</span></div>
      <div class="cl-item">${T(it.text)}</div>
      <div class="cl-bins">${cfg.bins.map((b) => `<button type="button" class="bin" data-bin="${esc(b.id)}"><b>${plain(b.label)}</b>${b.hint ? `<span>${plain(b.hint)}</span>` : ''}</button>`).join('')}</div>
      <div class="g-feedback" aria-live="polite"></div>`;
    $$('.bin', host).forEach((b) => b.addEventListener('click', () => pick(b.dataset.bin)));
  }
  function pick(id) {
    const it = items[i]; const okIds = [].concat(it.bin); const ok = okIds.includes(id);
    if (ok) right++;
    log.push({ it, ok });
    $$('.bin', host).forEach((b) => { b.disabled = true; if (okIds.includes(b.dataset.bin)) b.classList.add('ok'); else if (b.dataset.bin === id) b.classList.add('no'); });
    const fb = $('.g-feedback', host); fb.className = 'g-feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<span class="verdict">${ok ? 'Correct' : 'Not quite. Answer: ' + okIds.map(binLabel).join(' or ')}</span><p>${T(it.why)}</p><div class="g-actions"><button type="button" class="btn sm" id="cl-go">${i + 1 < n ? 'Next item →' : 'Finish'}</button></div>`;
    $('#cl-right').textContent = right + ' correct';
    const go2 = $('#cl-go'); go2.addEventListener('click', () => { i++; if (i < n) show(); else finish(); }); go2.focus({ preventScroll: true });
  }
  function finish() {
    const score = right / n; api.done(score);
    host.innerHTML = `${doneBanner(score, `You placed ${right} of ${n} correctly.`)}
      <div class="recap">${log.map((l) => `<div><span class="mk ${l.ok ? 'ok' : 'no'}">${l.ok ? '✓' : '✗'}</span><span>${T(l.it.text)} → <b>${[].concat(l.it.bin).map(binLabel).join(' / ')}</b></span></div>`).join('')}</div>`;
  }
  show();
};

/* Build an ordered procedure by picking the next step each time. */
GAMES.sequence = function (host, cfg, api) {
  const steps = cfg.steps.map((s, k) => Object.assign({ k }, s)); const n = steps.length;
  const pool = shuffle(steps.slice()); let pos = 0, mistakes = 0, missHere = 0;
  function render(msg, cls, bad) {
    const placed = steps.slice(0, pos);
    host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
      <div class="g-progress"><span>${pos < n ? 'Step ' + (pos + 1) + ' of ' + n : 'All ' + n + ' steps placed'}</span><span>${mistakes} wrong pick${mistakes === 1 ? '' : 's'}</span></div>
      ${cfg.lanes ? `<div class="fig"><div class="scroll-x">${seqSVG(cfg.lanes, placed.map((s) => ({ from: s.from, to: s.to, label: s.short || plain(s.text), kind: s.kind })), { minRows: n, colW: cfg.colW })}</div></div>` : ''}
      <div class="g-feedback ${cls || ''}" aria-live="polite">${msg || ''}</div>
      <div class="seq-wrap">
        <div class="seq-col"><h4>Pick the next step</h4><div class="seq-pool">${pool.filter((s) => s.k >= pos).map((s) => `<button type="button" class="seq-card${missHere >= 2 && s.k === pos ? ' hint' : ''}${bad === s.k ? ' no shake' : ''}" data-k="${s.k}">${plain(s.text)}</button>`).join('') || '<p class="seq-empty">Every step is placed.</p>'}</div></div>
        <div class="seq-col"><h4>Your sequence</h4>${placed.length ? `<ol class="seq-built">${placed.map((s) => `<li><div><b>${T(s.text)}</b><span>${T(s.why || '')}</span></div></li>`).join('')}</ol>` : '<p class="seq-empty">Nothing yet. Choose what happens first.</p>'}</div>
      </div>`;
    $$('.seq-card', host).forEach((b) => b.addEventListener('click', () => pick(+b.dataset.k)));
  }
  function pick(k) {
    if (k === pos) {
      pos++; missHere = 0;
      if (pos === n) return finish();
      render(`<span class="verdict">Correct.</span><p>${T(steps[k].why || '')}</p>`, 'ok');
    } else {
      mistakes++; missHere++;
      const s = steps[k];
      render(`<span class="verdict">Not yet.</span><p>${T(s.early || 'Something else has to happen before this step.')}${missHere >= 2 ? ' The highlighted card comes next.' : ''}</p>`, 'no', k);
    }
  }
  function finish() {
    const score = Math.max(0, 1 - mistakes / n); api.done(score);
    render(doneBanner(score, `Sequence complete with ${mistakes} wrong pick${mistakes === 1 ? '' : 's'}. Read the finished sequence below; it is the procedure you need to remember.`), 'info');
  }
  render();
};

/* Pair items from two columns. */
GAMES.match = function (host, cfg, api) {
  const pairs = cfg.pairs.map((p, k) => Object.assign({ k }, p)); const n = pairs.length;
  const L = shuffle(pairs.slice()), R = shuffle(pairs.slice());
  let sel = null, mistakes = 0, done = 0; const paired = {}; const log = [];
  function btn(side, p, bad) {
    const pn = paired[p.k];
    return `<button type="button" class="m-item${pn ? ' paired' : ''}${sel && sel.side === side && sel.k === p.k ? ' sel' : ''}${bad ? ' no shake' : ''}" data-side="${side}" data-k="${p.k}" ${pn ? 'disabled' : ''}>${pn ? `<span class="pn">${pn}</span>` : ''}<span>${plain(side === 'a' ? p.a : p.b)}</span></button>`;
  }
  function render(msg, cls, badA, badB) {
    host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
      <div class="g-progress"><span>${done} of ${n} pairs</span><span>${mistakes} miss${mistakes === 1 ? '' : 'es'}</span></div>
      <div class="match"><div class="m-col"><h4>${esc(cfg.left || 'Item')}</h4>${L.map((p) => btn('a', p, badA === p.k)).join('')}</div>
        <div class="m-col"><h4>${esc(cfg.right || 'Match')}</h4>${R.map((p) => btn('b', p, badB === p.k)).join('')}</div></div>
      <div class="g-feedback ${cls || ''}" aria-live="polite">${msg || ''}</div>
      ${log.length ? `<div class="m-log">${log.map((l) => `<p>${l}</p>`).join('')}</div>` : ''}`;
    $$('.m-item', host).forEach((b) => b.addEventListener('click', () => click(b.dataset.side, +b.dataset.k)));
  }
  function click(side, k) {
    if (!sel || sel.side === side) { sel = { side, k }; return render(); }
    const a = side === 'a' ? k : sel.k, b = side === 'b' ? k : sel.k; sel = null;
    if (a === b) {
      done++; paired[a] = done; const p = pairs[a];
      log.unshift(`<b>${done}. ${plain(p.a)} ↔ ${plain(p.b)}.</b> ${T(p.why || '')}`);
      if (done === n) {
        const score = n / (n + mistakes); api.done(score);
        return render(doneBanner(score, `All ${n} pairs matched with ${mistakes} miss${mistakes === 1 ? '' : 'es'}.`), 'info');
      }
      render(`<span class="verdict">Matched.</span>`, 'ok');
    } else { mistakes++; render(`<span class="verdict">Those two don't belong together.</span><p>Try another pairing.</p>`, 'no', a, b); }
  }
  render();
};

/* Label the reference points on an architecture diagram. */
GAMES.label = function (host, cfg, api) {
  const spec = cfg.diagram; const qIdx = spec.links.map((l, i) => (l.label && !l.given ? i : -1)).filter((i) => i >= 0);
  const pool = [...new Set(spec.links.filter((l) => l.label).map((l) => l.label))];
  const state = {}; let active = null, first = 0, answered = 0;
  qIdx.forEach((i) => { const l = spec.links[i]; state[i] = { ok: false, tries: 0, opts: shuffle([l.label, ...shuffle(pool.filter((p) => p !== l.label)).slice(0, 3)]) }; });
  const N = {}; spec.nodes.forEach((n) => { N[n.id] = n; });
  function render(msg, cls) {
    host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
      <div class="g-progress"><span>${answered} of ${qIdx.length} links labelled</span><span>${first} right first time</span></div>
      <div class="fig"><div class="scroll-x">${archSVG(spec, { quiz: true, state, active })}</div>${archKey(spec)}</div>
      <div class="lab-panel" aria-live="polite">${panel(msg, cls)}</div>`;
    $$('.badge.q', host).forEach((g) => {
      const act = () => { active = +g.dataset.li; render(); };
      g.addEventListener('click', act);
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
    $$('.lab-opt', host).forEach((b) => b.addEventListener('click', () => answer(b.dataset.v)));
  }
  function panel(msg, cls) {
    if (active == null || !state[active]) return msg || `<p><b>Click a yellow number</b> on the diagram, then choose the name of that reference point.</p>`;
    const l = spec.links[active]; const s = state[active];
    if (s.ok) return `<div class="g-feedback ok"><span class="verdict">${esc(l.label)}: ${esc(N[l.a].label)} ↔ ${esc(N[l.b].label)}</span><p>${T(l.why || '')}</p></div>${msg || ''}`;
    return `<p><b>Link ${qIdx.indexOf(active) + 1}:</b> ${esc(N[l.a].label)} ↔ ${esc(N[l.b].label)}. Which reference point is this?</p>
      <div class="lab-opts">${s.opts.map((o) => `<button type="button" class="lab-opt${s.wrong && s.wrong.includes(o) ? ' no' : ''}" data-v="${esc(o)}" ${s.wrong && s.wrong.includes(o) ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>${msg || ''}`;
  }
  function answer(v) {
    const l = spec.links[active]; const s = state[active];
    if (v === l.label) {
      s.ok = true; answered++; if (!s.tries) first++;
      if (answered === qIdx.length) {
        const score = first / qIdx.length; api.done(score);
        active = null;
        return render(doneBanner(score, `All ${qIdx.length} reference points labelled; ${first} right on the first try.`));
      }
      render();
    } else {
      s.tries++; s.wrong = (s.wrong || []).concat(v);
      render(`<div class="g-feedback no"><span class="verdict">Not that one.</span><p>${esc(v)} connects other boxes. Look at which two functions this link joins.</p></div>`);
    }
  }
  render();
};

/* Numeric questions with tolerance and worked solutions. */
GAMES.calc = function (host, cfg, api) {
  const items = cfg.items.map((it) => (typeof it === 'function' ? it() : it));
  const st = items.map(() => ({ tries: 0, done: false, pts: 0 }));
  host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
    <div class="calc-list">${items.map((it, i) => `<div class="calc-item" id="ci-${i}">
      <p><b>${i + 1}.</b> ${T(it.q)}</p>
      <div class="calc-row"><label class="sr" for="cin-${i}" hidden>Answer ${i + 1}</label><input id="cin-${i}" inputmode="decimal" autocomplete="off" aria-label="Answer ${i + 1}">
        ${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ''}<button type="button" class="btn sm" data-c="${i}">Check</button><button type="button" class="btn ghost sm" data-r="${i}" hidden>Show answer</button></div>
      <p class="calc-msg" id="cm-${i}" aria-live="polite"></p><div class="solution" id="cs-${i}" hidden>${T(it.solution)}</div></div>`).join('')}</div>
    <div id="calc-end"></div>`;
  const check = (i) => {
    if (st[i].done) return;
    const it = items[i]; const raw = $('#cin-' + i, host).value.replace(/,/g, '').trim(); const v = parseFloat(raw);
    const msg = $('#cm-' + i, host);
    if (!raw || Number.isNaN(v)) { msg.className = 'calc-msg no'; msg.textContent = 'Type a number first.'; return; }
    const tol = it.tol != null ? it.tol : Math.abs(it.answer) * 0.02 + 1e-9;
    if (Math.abs(v - it.answer) <= tol) {
      st[i].done = true; st[i].pts = st[i].tries === 0 ? 1 : st[i].tries === 1 ? 0.6 : 0.3;
      $('#ci-' + i, host).classList.add('solved'); msg.className = 'calc-msg ok'; msg.textContent = st[i].tries === 0 ? 'Correct on the first try.' : 'Correct.';
      $('#cs-' + i, host).hidden = false; $('[data-r="' + i + '"]', host).hidden = true;
    } else {
      st[i].tries++; msg.className = 'calc-msg no'; msg.innerHTML = 'Not quite. ' + T(it.hint || 'Check your units and try again.');
      if (st[i].tries >= 2) $('[data-r="' + i + '"]', host).hidden = false;
    }
    end();
  };
  const reveal = (i) => {
    st[i].done = true; st[i].pts = 0; $('#ci-' + i, host).classList.add('revealed');
    const m = $('#cm-' + i, host); m.className = 'calc-msg'; m.textContent = 'Answer: ' + items[i].answer + (items[i].unit ? ' ' + items[i].unit : '');
    $('#cs-' + i, host).hidden = false; $('[data-r="' + i + '"]', host).hidden = true; end();
  };
  function end() {
    if (!st.every((s) => s.done)) return;
    const score = st.reduce((a, s) => a + s.pts, 0) / st.length; api.done(score);
    $('#calc-end', host).innerHTML = doneBanner(score, 'All questions answered. Read each worked solution: the method matters more than the number.');
  }
  $$('[data-c]', host).forEach((b) => b.addEventListener('click', () => check(+b.dataset.c)));
  $$('[data-r]', host).forEach((b) => b.addEventListener('click', () => reveal(+b.dataset.r)));
  $$('.calc-row input', host).forEach((inp, i) => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(i); }));
};

/* Multiple choice with an explanation after every answer. */
GAMES.quiz = function (host, cfg, api) {
  const items = cfg.items; const n = items.length; let i = 0, right = 0; const log = [];
  function show() {
    const it = items[i]; const order = it.keep ? it.options.map((_, j) => j) : shuffle(it.options.map((_, j) => j));
    host.innerHTML = `<div class="quiz">
      <div class="g-progress"><span>Question ${i + 1} of ${n}</span><span>${right} correct</span></div>
      ${it.scene ? `<p class="scene">${T(it.scene)}</p>` : ''}
      <p class="q">${T(it.q)}</p>
      <div class="opts">${order.map((j, x) => `<button type="button" class="opt" data-j="${j}"><span class="k">${'ABCDEF'[x]}</span><span>${plain(it.options[j])}</span></button>`).join('')}</div>
      <div class="g-feedback" aria-live="polite"></div></div>`;
    $$('.opt', host).forEach((b) => b.addEventListener('click', () => pick(+b.dataset.j)));
  }
  function pick(j) {
    const it = items[i]; const ok = j === it.answer; if (ok) right++;
    log.push({ it, ok });
    $$('.opt', host).forEach((b) => { b.disabled = true; const bj = +b.dataset.j; if (bj === it.answer) b.classList.add('ok'); else if (bj === j) b.classList.add('no'); });
    const fb = $('.g-feedback', host); fb.className = 'g-feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<span class="verdict">${ok ? 'Correct' : 'Not quite. The answer is: ' + plain(it.options[it.answer])}</span><p>${T(it.why)}</p><div class="g-actions"><button type="button" class="btn sm" id="q-go">${i + 1 < n ? 'Next question →' : 'Finish'}</button></div>`;
    const b = $('#q-go'); b.addEventListener('click', () => { i++; if (i < n) show(); else finish(); }); b.focus({ preventScroll: true });
  }
  function finish() {
    const score = right / n; api.done(score);
    host.innerHTML = `${doneBanner(score, `${right} of ${n} correct.`)}
      <div class="recap">${log.map((l) => `<div><span class="mk ${l.ok ? 'ok' : 'no'}">${l.ok ? '✓' : '✗'}</span><span>${plain(l.it.q)} <b>${plain(l.it.options[l.it.answer])}</b></span></div>`).join('')}</div>`;
  }
  show();
};

/* ============================================================
   Diagram helpers (inline SVG, themed through CSS classes)
   ============================================================ */
function arrowHead(x, y, dir, cls) {
  // dir: 'r','l','u','d'
  const s = 8, w = 4.5;
  const pts = { r: [[x, y], [x - s, y - w], [x - s, y + w]], l: [[x, y], [x + s, y - w], [x + s, y + w]], d: [[x, y], [x - w, y - s], [x + w, y - s]], u: [[x, y], [x - w, y + s], [x + w, y + s]] }[dir];
  return `<polygon class="ah ${cls || ''}" points="${pts.map((p) => p.join(',')).join(' ')}"/>`;
}

/* Message sequence chart. lanes: [{id,name,kind}], msgs: [{from,to,label,kind}] */
function seqSVG(lanes, msgs, opt = {}) {
  const colW = opt.colW || 126, padX = 8, top = 50, rowH = opt.rowH || 32;
  const rows = Math.max(msgs.length, opt.minRows || 0);
  const W = padX * 2 + colW * lanes.length, H = top + rowH * rows + 12;
  const cx = (i) => padX + colW * i + colW / 2;
  let s = `<svg class="dg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || 'Message sequence chart')}">`;
  lanes.forEach((l, i) => {
    const x = cx(i);
    s += `<line class="life" x1="${x}" y1="${top - 10}" x2="${x}" y2="${H - 4}"/>`;
    s += `<rect class="box ${l.kind || 'core'}" x="${x - colW / 2 + 7}" y="6" width="${colW - 14}" height="30" rx="6"/>`;
    s += `<text class="t-md" x="${x}" y="26" text-anchor="middle">${esc(l.name)}</text>`;
  });
  msgs.forEach((m, k) => {
    const y = top + rowH * k + rowH * 0.66;
    const a = lanes.findIndex((l) => l.id === m.from), b = lanes.findIndex((l) => l.id === m.to);
    const kind = m.kind || 'cp';
    if (a < 0) return;
    if (b < 0 || a === b) {
      const x = cx(a); const w = Math.min(colW * 1.6, Math.max(60, m.label.length * 6.1 + 16));
      s += `<rect class="box ${lanes[a].kind || 'core'}" x="${x - w / 2}" y="${y - 15}" width="${w}" height="21" rx="4"/><text class="t-sm" x="${x}" y="${y - 0.5}" text-anchor="middle">${esc(m.label)}</text>`;
    } else {
      const x1 = cx(a), x2 = cx(b), dir = x2 > x1 ? 1 : -1;
      s += `<line class="ln ${kind}" x1="${x1}" y1="${y}" x2="${x2 - dir * 7}" y2="${y}"/>`;
      s += arrowHead(x2, y, dir > 0 ? 'r' : 'l', kind);
      s += `<text class="t-sm halo" x="${(x1 + x2) / 2}" y="${y - 6}" text-anchor="middle">${esc(m.label)}</text>`;
    }
  });
  return s + '</svg>';
}

/* Architecture diagram with labelled links. */
function archSVG(spec, opt = {}) {
  const N = {}; spec.nodes.forEach((n) => { N[n.id] = n; });
  let s = `<svg class="dg" width="${spec.w}" height="${spec.h}" viewBox="0 0 ${spec.w} ${spec.h}" role="img" aria-label="${esc(spec.aria || 'Architecture diagram')}">`;
  spec.links.forEach((l) => {
    const A = N[l.a], B = N[l.b];
    const d = l.path || `M${A.x},${A.y} L${B.x},${B.y}`;
    s += `<path class="ln ${l.kind || ''}" d="${d}"/>`;
  });
  spec.nodes.forEach((n) => {
    const w = n.w || 96, h = n.h || 38;
    s += `<rect class="box ${n.kind || 'core'}" x="${n.x - w / 2}" y="${n.y - h / 2}" width="${w}" height="${h}" rx="7"/>`;
    s += `<text class="t-md" x="${n.x}" y="${n.y + (n.sub ? -2 : 4.5)}" text-anchor="middle">${esc(n.label)}</text>`;
    if (n.sub) s += `<text class="t-sm t-mute" x="${n.x}" y="${n.y + 12}" text-anchor="middle">${esc(n.sub)}</text>`;
  });
  let q = 0;
  spec.links.forEach((l, i) => {
    if (!l.label) return;
    const A = N[l.a], B = N[l.b];
    const bx = l.bx != null ? l.bx : (A.x + B.x) / 2, by = l.by != null ? l.by : (A.y + B.y) / 2;
    let txt = l.label, cls = '', extra = '';
    if (opt.quiz && !l.given) {
      q++;
      const st = (opt.state || {})[i];
      if (st && st.ok) cls = 'ok';
      else { txt = String(q); cls = 'q' + (opt.active === i ? ' sel' : ''); extra = ` tabindex="0" role="button" aria-label="Link ${q}: ${esc(A.label)} to ${esc(B.label)}"`; }
    }
    const w = Math.max(24, txt.length * 7 + 12);
    s += `<g class="badge ${cls}" data-li="${i}"${extra}><rect x="${bx - w / 2}" y="${by - 10}" width="${w}" height="20" rx="5"/><text x="${bx}" y="${by + 4}" text-anchor="middle">${esc(txt)}</text></g>`;
  });
  return s + '</svg>';
}
function archKey(spec) {
  const kinds = new Set(spec.links.map((l) => l.kind || 'plain'));
  const names = { up: 'User plane', cp: 'Control plane', lg: 'Logical V2X reference point', plain: 'Other interface', ul: 'Uplink', dl: 'Downlink' };
  return `<div class="key-row">${[...kinds].map((k) => `<span><i class="key-line ${k}"></i>${names[k] || k}</span>`).join('')}</div>`;
}

/* Rows of boxes with connecting lines (channel maps, key trees). */
function layeredSVG(spec) {
  const W = spec.w || 700, rowGap = spec.rowGap || 76, top = spec.top || 26, labelW = spec.labelW || 92, bh = 30;
  const H = top + rowGap * (spec.rows.length - 1) + bh + 16;
  const pos = {};
  let s = `<svg class="dg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'Diagram')}">`;
  spec.rows.forEach((r, ri) => {
    const y = top + ri * rowGap; const n = r.items.length; const span = W - labelW - 10;
    r.items.forEach((it, k) => {
      const w = it.w || Math.max(54, it.t.length * 7.4 + 18);
      const x = it.x != null ? it.x : labelW + span * (k + 0.5) / n;
      pos[it.id] = { x, y, w };
    });
    if (r.label) s += `<text class="t-sm t-mute" x="6" y="${y + bh / 2 + 4}">${esc(r.label)}</text>`;
  });
  (spec.links || []).forEach((l) => {
    const A = pos[l.a], B = pos[l.b]; if (!A || !B) return;
    const y1 = A.y + bh, y2 = B.y;
    s += `<path class="ln thin ${l.kind || ''}" d="M${A.x},${y1} C${A.x},${(y1 + y2) / 2} ${B.x},${(y1 + y2) / 2} ${B.x},${y2 - 6}"/>`;
    s += arrowHead(B.x, y2, 'd', l.kind || '');
  });
  spec.rows.forEach((r) => r.items.forEach((it) => {
    const p = pos[it.id];
    s += `<rect class="box ${it.kind || 'core'}" x="${p.x - p.w / 2}" y="${p.y}" width="${p.w}" height="${bh}" rx="6"/><text class="t-sm" x="${p.x}" y="${p.y + 19}" text-anchor="middle">${esc(it.t)}</text>`;
  }));
  return s + '</svg>';
}

/* Protocol stacks side by side. cols: [{name, kind, layers:[{t,kind}|null] (top -> bottom)}] */
function stackSVG(cols, opt = {}) {
  const colW = opt.colW || 116, gap = opt.gap || 30, rowH = 27, top = 40;
  const rows = Math.max(...cols.map((c) => c.layers.length));
  const W = cols.length * colW + (cols.length - 1) * gap + 16, H = top + rows * rowH + 44;
  let s = `<svg class="dg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || 'Protocol stacks')}">`;
  const colX = (i) => 8 + i * (colW + gap);
  cols.forEach((c, i) => {
    const x = colX(i);
    s += `<text class="t-md" x="${x + colW / 2}" y="24" text-anchor="middle">${esc(c.name)}</text>`;
    const off = rows - c.layers.length;
    c.layers.forEach((L, j) => {
      if (!L) return;
      const y = top + (off + j) * rowH;
      s += `<rect class="box ${L.kind || 'core'}" x="${x}" y="${y}" width="${colW}" height="${rowH - 3}" rx="4"/><text class="t-sm" x="${x + colW / 2}" y="${y + 16}" text-anchor="middle">${esc(L.t)}</text>`;
    });
  });
  (opt.links || []).forEach((l) => {
    const x1 = colX(l.from) + colW, x2 = colX(l.to); const y = top + rows * rowH + 10;

  pss: ['Primary synchronisation signal', 'In FDD, the last symbol of slot 0 in subframes 0 and 5, central 62 subcarriers. Gives 5 ms timing and N_ID(2).'],
  sss: ['Secondary synchronisation signal', 'Symbol just before the PSS (FDD). Gives 10 ms frame timing and N_ID(1).'],
  pbch: ['Physical broadcast channel', 'First four symbols of slot 1 in subframe 0, central 72 subcarriers. Carries the MIB.'],
  pdsch: ['PDSCH', 'Everything left over carries user data and SIBs, scheduled by the PDCCH.'],

}

GAMES.gridfind = function (host, cfg, api) {

  }

    s.tries++;
    if (!fails.length) { s.passed = true; s.pts = s.tries === 1 ? 1 : s.tries === 2 ? 0.75 : 0.5; s.fb = `<span class="verdict">Mission passed${s.tries === 1 ? ' on the first submit' : ''}.</span><p>${T(m.debrief)}</p>`; s.cls = 'ok'; }
    else { s.fb = `<span class="verdict">Not yet (attempt ${s.tries}).</span><ul>${fails.map((f) => `<li>${f}</li>`).join('')}</ul>`; s.cls = 'no'; }

  render();
};

/* ---------- broadcast commander ---------- */
GAMES.broadcast = function (host, cfg, api) {
  const R = 30, HW = Math.sqrt(3) * R, rows = 3, cols = 7;
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ id: r * cols + c, r, c, x: 24 + HW / 2 + c * HW + (r % 2 ? HW / 2 : 0), y: 18 + R + r * 1.5 * R });
  const W = 24 * 2 + HW * cols + HW / 2, H = 36 + 2 * R + 3 * R;
  const ms = cfg.scenarios; let si = 0;
  const S = ms.map(() => ({ method: null, sel: new Set(), tries: 0, pts: null, fb: '', cls: '', table: '' }));
  const methods = [{ id: 'uni', t: 'Unicast' }, { id: 'scptm', t: 'SC-PTM' }, { id: 'mbsfn', t: 'MBSFN area' }];
  const costOf = (id, sc) => id === 'uni' ? 2 * sc.n : id === 'scptm' ? 5 * sc.affected.length : 3 * sc.affected.length + 6;
  function hexPts(x, y) { const p = []; for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); p.push((x + R * Math.cos(a)).toFixed(1) + ',' + (y + R * Math.sin(a)).toFixed(1)); } return p.join(' '); }
  function mapSVG(sc, s) {
    const rng = mulberry32(si * 97 + 13);
    let svg = `<svg class="dg" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="Map of 21 cells along a highway">`;
    cells.forEach((c) => {
      const aff = sc.affected.includes(c.id), sel = s.sel.has(c.id);
      svg += `<g class="hex${aff ? ' aff' : ''}${sel ? ' sel' : ''}${s.method === 'uni' || s.pts != null ? ' nohover' : ''}" data-c="${c.id}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="Cell ${c.id + 1}${aff ? ', in the hazard area' : ''}"><polygon points="${hexPts(c.x, c.y)}"/></g>`;
    });
    const y0 = cells[cols].y;
    svg += `<rect class="fill-road" x="6" y="${y0 - 7}" width="${W - 12}" height="14" rx="3" pointer-events="none"/><line x1="10" x2="${W - 10}" y1="${y0}" y2="${y0}" style="stroke:var(--lane)" stroke-width="2" stroke-dasharray="10 8" pointer-events="none"/>`;
    cells.forEach((c) => {
      const n = (sc.vehicles[c.id] || 0); const shown = Math.min(n, 14);
      for (let v = 0; v < shown; v++) { const a = rng() * Math.PI * 2, d = rng() * R * 0.62; svg += `<circle class="${sc.affected.includes(c.id) ? 'fill-bad' : 'fill-blue'}" cx="${(c.x + d * Math.cos(a)).toFixed(1)}" cy="${(c.y + d * Math.sin(a)).toFixed(1)}" r="2.6" pointer-events="none"/>`; }
      if (n) svg += `<text class="t-mono" x="${c.x}" y="${c.y - R * 0.55}" text-anchor="middle" pointer-events="none">${n}</text>`;
    });
    return svg + '</svg>';
  }
  function render() {
    const sc = ms[si], s = S[si]; const allDone = S.every((x) => x.pts != null);
    host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
      <div class="mission-tabs" role="group" aria-label="Scenarios">${ms.map((x, k) => `<button type="button" class="mtab${S[k].pts ? ' passed' : ''}" data-m="${k}" aria-pressed="${k === si}">Scenario ${k + 1}</button>`).join('')}</div>
      <div class="sim"><div class="sim-ctrl">
        <div class="mission"><span class="eyebrow">Scenario ${si + 1}: ${esc(sc.name)}</span><p>${T(sc.story)}</p><p class="small"><b>Vehicles that need it:</b> ${sc.n} in ${sc.affected.length} cell${sc.affected.length > 1 ? 's' : ''} (red).</p></div>
        <div class="ctl"><span class="lbl">1 · Delivery method</span>${segButtons('method', methods, s.method)}</div>
        <div class="ctl"><span class="lbl">2 · Cells to transmit in</span><p class="small muted">${s.method === 'uni' ? 'Unicast follows each vehicle through its own bearer, so there is no cell list to pick.' : 'Click cells on the map to add or remove them. Selected: ' + s.sel.size + '.'}</p></div>
        <div class="g-actions"><button type="button" class="btn" id="bc-sub" ${!s.method || s.pts != null ? 'disabled' : ''}>Send the warning</button></div>
        <div class="g-feedback ${s.cls}" aria-live="polite">${s.fb}</div>
      </div><div class="sim-view">${mapSVG(sc, s)}
        <div class="key-row"><span><i class="sw" style="background:var(--bad-soft)"></i>Hazard area</span><span><i class="sw" style="border:3px solid var(--sign)"></i>Selected cell</span><span><i class="sw" style="background:var(--bad);border-radius:99px"></i>Vehicle that needs the warning</span><span>Number = vehicles in cell</span></div>
        ${s.table}</div></div>
      ${allDone ? doneBanner(S.reduce((a, x) => a + x.pts, 0) / S.length, 'All scenarios resolved. The rule of thumb: few receivers → unicast; many receivers in one or two cells → SC-PTM; many receivers over a wide, stable area → MBSFN.') : ''}`;
    $$('.segbtn', host).forEach((b) => b.addEventListener('click', () => { if (s.pts != null) return; s.method = b.dataset.v; s.fb = ''; render(); }));
    $$('.mtab', host).forEach((b) => b.addEventListener('click', () => { si = +b.dataset.m; render(); }));
    $$('.hex', host).forEach((g) => {
      const tog = () => { if (s.method === 'uni' || s.pts != null) return; const id = +g.dataset.c; if (s.sel.has(id)) s.sel.delete(id); else s.sel.add(id); render(); };
      g.addEventListener('click', tog); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
    });
    const sub = $('#bc-sub', host); if (sub) sub.addEventListener('click', submit);
  }
  function submit() {
    const sc = ms[si], s = S[si]; s.tries++;

    const extra = s.method === 'uni' ? 0 : [...s.sel].filter((c) => !sc.affected.includes(c)).length;
    const bestOK = s.method === sc.best;
    s.table = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Method</th><th>Downlink cost per message</th></tr></thead><tbody>
      <tr><td>Unicast</td><td class="n">2 × ${sc.n} vehicles = ${costOf('uni', sc)}</td></tr>
      <tr><td>SC-PTM</td><td class="n">5 × ${sc.affected.length} cells = ${costOf('scptm', sc)}</td></tr>
      <tr><td>MBSFN</td><td class="n">3 × ${sc.affected.length} cells + 6 = ${costOf('mbsfn', sc)}</td></tr></tbody></table></div>
      <p class="small muted">Model: unicast needs about 2 RB-pairs per vehicle plus its own control and HARQ; SC-PTM about 5 per cell (robust MCS, no HARQ); MBSFN about 3 per cell thanks to the single-frequency-network gain (cells send in reserved subframes), plus a fixed overhead per area for the MCCH control channel and session setup.</p>`;
    const probs = [];
    if (missing.length) probs.push(`${missing.length} hazard cell${missing.length > 1 ? 's are' : ' is'} not covered, so vehicles there never get the warning.`);
    if (!bestOK) probs.push(`${methods.find((m) => m.id === s.method).t} works, but it is not the efficient choice here. Compare the costs in the table.`);
    if (!probs.length) {
      const cf = extra === 0 ? 1 : extra === 1 ? 0.85 : 0.6;
      s.pts = (s.tries === 1 ? 1 : 0.6) * cf;
      s.fb = `<span class="verdict">Warning delivered.</span><p>${T(sc.why)}</p>${extra ? `<p>You also lit up ${extra} cell${extra > 1 ? 's' : ''} outside the hazard area, which wastes capacity (score × ${cf}).</p>` : ''}`; s.cls = 'ok';
      if (S.every((x) => x.pts != null)) api.done(S.reduce((a, x) => a + x.pts, 0) / S.length);
    } else { s.fb = `<span class="verdict">Not the best plan yet.</span><ul>${probs.map((p) => `<li>${p}</li>`).join('')}</ul><p class="small">Change your plan and send again.</p>`; s.cls = 'no'; }
    render();
  }
  render();
};

/* ---------- handover highway ---------- */
function hoRun(hys, ttt, kmh) {
  const v = kmh / 3.6, dt = 0.01, off = 35, xB = 1000, x0 = 200, x1 = 960;
  const rng = mulberry32(7 + Math.round(kmh));
  // deterministic shadow fading (dB) per cell; 3GPP macro path loss 128.1 + 37.6 log10(d_km)
  const shA = (x) => 0.85 * (2.4 * Math.sin(2 * Math.PI * x / 83 + 1.3) + 1.4 * Math.sin(2 * Math.PI * x / 31 + 0.4) + 0.7 * Math.sin(2 * Math.PI * x / 12 + 2.2));
  const shB = (x) => 0.85 * (2.4 * Math.sin(2 * Math.PI * x / 77 + 4.1) + 1.4 * Math.sin(2 * Math.PI * x / 29 + 2.9) + 0.7 * Math.sin(2 * Math.PI * x / 13 + 5.0));
  const pl = (d) => 15.2 - (128.1 + 37.6 * Math.log10(Math.max(d, 20) / 1000));
  let t = 0, x = x0, serving = 'A', fA = null, fB = null, a3 = null, pending = null, lastHO = -99, hoCount = 0, ping = 0, low = null, fail = null, nextMeas = 0;
  const ev = [], trace = [], hoX = [];
  while (x < x1 && !fail) {
    const a0 = pl(Math.hypot(x, off)), b0 = pl(Math.hypot(x - xB, off));
    const rA = a0 + shA(x), rB = b0 + shB(x);
    if (t >= nextMeas - 1e-9) {
      const mA = rA + gauss(rng) * 1.3, mB = rB + gauss(rng) * 1.3;
      fA = fA == null ? mA : 0.5 * fA + 0.5 * mA; fB = fB == null ? mB : 0.5 * fB + 0.5 * mB;
      nextMeas += 0.04;
      const s = serving === 'A' ? fA : fB, n = serving === 'A' ? fB : fA;
      if (pending == null) {
        if (n - hys > s) {
          if (a3 == null) { a3 = t; ev.push(['', t, x, `A3 entering condition met (neighbour ${(n - s).toFixed(1)} dB stronger); time-to-trigger running`]); }
          if (t - a3 >= ttt / 1000 - 1e-9) { ev.push(['warn', t, x, 'Measurement report sent; eNB prepares the handover over X2']); pending = t + 0.05; a3 = null; }
        } else if (a3 != null) { ev.push(['', t, x, 'A3 condition dropped before time-to-trigger expired']); a3 = null; }
      }
    }
    const qA = a0 + 0.4 * shA(x), qB = b0 + 0.4 * shB(x); // link quality: interference partly averaged over the band
    const sv = serving === 'A' ? qA : qB, nb = serving === 'A' ? qB : qA;
    const sinr = sv - 10 * Math.log10(10 ** (nb / 10) + 10 ** (-118 / 10));
    if (pending != null && t >= pending) {
      if (sinr < -6.5) { fail = `Too late: the handover command could not be decoded (serving SINR ${sinr.toFixed(1)} dB). Radio link failure.`; ev.push(['bad', t, x, fail]); break; }
      const to = serving === 'A' ? 'B' : 'A'; hoCount++;
      if (hoCount > 1 && t - lastHO < 1) { ping++; ev.push(['bad', t, x, `Ping-pong: handed back to ${to} only ${(t - lastHO).toFixed(2)} s after the previous handover`]); }
      else ev.push(['ok', t, x, `Handover to cell ${to} completed (SINR at command ${sinr.toFixed(1)} dB)`]);
      serving = to; lastHO = t; pending = null; hoX.push([x, to]);
    }
    if (sinr < -8) { if (low == null) low = t; if (t - low >= 1) { fail = 'Radio link failure: serving SINR stayed below −8 dB for 1 s (T310 expired).'; ev.push(['bad', t, x, fail]); } } else low = null;
    if (Math.round(t / dt) % 3 === 0) trace.push([x, rA, rB, serving]);
    t += dt; x += v * dt;
  }
  if (!fail && serving !== 'B') { fail = 'The car reached the end of the road still attached to cell A.'; ev.push(['bad', t, x, fail]); }
  return { ev, trace, fail, ping, hoCount, hoX, v };
}
GAMES.handover = function (host, cfg, api) {
  const TTT = [0, 40, 80, 160, 320, 640, 1280];
  const ms = cfg.missions; let mi = 0; let hys = 1, ttt = 40; let res = null;
  const S = ms.map(() => ({ tries: 0, pts: null, fb: '', cls: '' }));
  function chart(r) {
    const W = 560, H = 230, gx = 44, gy = 10, gw = W - gx - 10, gh = H - gy - 34;
    const xs = (x) => gx + (x - 200) / 760 * gw, ys = (p) => gy + (-75 - p) / 45 * gh;
    let s = `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Received power of cell A and cell B along the road">`;
    for (let p = -80; p >= -120; p -= 10) s += `<line class="stroke-line" x1="${gx}" x2="${gx + gw}" y1="${ys(p)}" y2="${ys(p)}"/><text class="t-mono t-mute" x="${gx - 4}" y="${ys(p) + 4}" text-anchor="end">${p}</text>`;
    for (let x = 200; x <= 960; x += 100) s += `<text class="t-mono t-mute" x="${xs(x)}" y="${gy + gh + 14}" text-anchor="middle">${x}</text>`;
    s += `<text class="t-sm t-mute" x="${gx + gw / 2}" y="${H - 2}" text-anchor="middle">distance from cell A (m) · cell B is at 1000 m</text>`;
    s += `<text class="t-sm t-mute" transform="translate(10 ${gy + gh / 2}) rotate(-90)" text-anchor="middle">RSRP (dBm)</text>`;
    if (r) {
      const pa = r.trace.map((p, i) => (i ? 'L' : 'M') + xs(p[0]).toFixed(1) + ',' + ys(clamp(p[1], -120, -75)).toFixed(1)).join('');
      const pb = r.trace.map((p, i) => (i ? 'L' : 'M') + xs(p[0]).toFixed(1) + ',' + ys(clamp(p[2], -120, -75)).toFixed(1)).join('');
      s += `<path class="ln dl" d="${pa}"/><path class="ln ul" d="${pb}"/>`;
      r.hoX.forEach((h, k) => { s += `<line class="stroke-ink" x1="${xs(h[0])}" x2="${xs(h[0])}" y1="${gy}" y2="${gy + gh}" stroke-dasharray="4 3"/><text class="t-sm halo" x="${xs(h[0]) + 3}" y="${gy + 12 + (k % 4) * 13}">→${h[1]}</text>`; });
      if (r.fail) { const last = r.ev[r.ev.length - 1]; s += `<circle class="fill-bad" cx="${xs(clamp(last[2], 200, 960))}" cy="${gy + gh - 8}" r="6"/>`; }
    }
    s += `<text class="t-sm" x="${gx + 6}" y="${gy + gh - 6}" style="fill:var(--d-dl)">cell A</text><text class="t-sm" x="${gx + gw - 6}" y="${gy + gh - 6}" text-anchor="end" style="fill:var(--d-ul)">cell B</text>`;
    return s + '</svg>';
  }
  function evaluate(h, t, speeds) {
    const out = speeds.map((k) => ({ k, r: hoRun(h, t, k) }));
    return { out, ok: out.every((o) => !o.r.fail && o.r.ping === 0) };
  }
  function render() {
    const m = ms[mi], s = S[mi]; const allDone = S.every((x) => x.pts != null);
    host.innerHTML = `${cfg.intro ? `<p class="g-intro">${T(cfg.intro)}</p>` : ''}
      <div class="mission-tabs" role="group" aria-label="Missions">${ms.map((x, k) => `<button type="button" class="mtab${S[k].pts ? ' passed' : ''}" data-m="${k}" aria-pressed="${k === mi}">Mission ${k + 1}</button>`).join('')}</div>
      <div class="sim"><div class="sim-ctrl">
        <div class="mission"><span class="eyebrow">Mission ${mi + 1}: ${esc(m.name)}</span><p>${T(m.story)}</p><p class="small"><b>Win:</b> one clean handover A → B (no ping-pong, no failure) at ${m.speeds.join(' and ')} km/h${m.speeds.length > 1 ? ', with the same settings' : ''}.</p></div>
        <div class="ctl"><label for="ho-h">Hysteresis: <span class="readout">${hys.toFixed(1)} dB</span></label><input type="range" id="ho-h" min="0" max="6" step="0.5" value="${hys}"></div>
        <div class="ctl"><label for="ho-t">Time-to-trigger: <span class="readout">${ttt} ms</span></label><input type="range" id="ho-t" min="0" max="${TTT.length - 1}" step="1" value="${TTT.indexOf(ttt)}"></div>
        <div class="g-actions"><button type="button" class="btn" id="ho-run" ${s.pts != null ? 'disabled' : ''}>Drive</button>${s.tries >= 3 && s.pts == null ? '<button type="button" class="btn ghost sm" id="ho-sol">Show a solution</button>' : ''}</div>
        <div class="g-feedback ${s.cls}" aria-live="polite">${s.fb}</div>
      </div><div class="sim-view">
        ${chart(res && res.out[res.out.length - 1].r)}
        <div class="key-row"><span><i class="key-line dl"></i>Cell A RSRP</span><span><i class="key-line ul"></i>Cell B RSRP</span><span><i class="key-line"></i>Handover executed</span></div>
        ${res ? res.out.map((o) => `<div><p class="small"><b>${o.k} km/h:</b> ${o.r.fail ? '<span class="pill no">failure</span>' : o.r.ping ? `<span class="pill no">${o.r.ping} ping-pong</span>` : '<span class="pill ok">clean handover</span>'}</p>
          <div class="evlog">${o.r.ev.map((e) => `<span class="${e[0] ? 'e-' + e[0] : ''}">t=${e[1].toFixed(2)} s · x=${Math.round(e[2])} m · ${esc(e[3])}</span>`).join('')}</div></div>`).join('') : '<p class="small muted">Set hysteresis and time-to-trigger, then press Drive. The chart shows the received power of both cells as the car moves; the log shows every RRC event.</p>'}
      </div></div>
      ${allDone ? doneBanner(S.reduce((a, x) => a + x.pts, 0) / S.length, T(cfg.finale)) : ''}`;
    $('#ho-h', host).addEventListener('input', (e) => { hys = +e.target.value; $('label[for=ho-h] .readout', host).textContent = hys.toFixed(1) + ' dB'; });
    $('#ho-t', host).addEventListener('input', (e) => { ttt = TTT[+e.target.value]; $('label[for=ho-t] .readout', host).textContent = ttt + ' ms'; });
    $$('.mtab', host).forEach((b) => b.addEventListener('click', () => { mi = +b.dataset.m; res = null; preset(); render(); }));
    const run = $('#ho-run', host); if (run) run.addEventListener('click', drive);
    const sol = $('#ho-sol', host); if (sol) sol.addEventListener('click', () => { hys = m.solution[0]; ttt = m.solution[1]; res = evaluate(hys, ttt, m.speeds); s.pts = 0; s.fb = `<span class="verdict">A working setting: ${hys} dB, ${ttt} ms</span><p>${T(m.debrief)}</p>`; s.cls = 'info'; if (S.every((x) => x.pts != null)) api.done(S.reduce((a, x) => a + x.pts, 0) / S.length); render(); });
  }
  function preset() { const m = ms[mi]; if (m.preset && S[mi].tries === 0) { hys = m.preset[0]; ttt = m.preset[1]; } }

    const m = ms[mi], s = S[mi]; res = evaluate(hys, ttt, m.speeds); s.tries++;
    if (res.ok) {
      s.pts = s.tries === 1 ? 1 : s.tries === 2 ? 0.75 : 0.5;
      s.fb = `<span class="verdict">Clean handover.</span><p>${T(m.debrief)}</p>`; s.cls = 'ok';
      if (S.every((x) => x.pts != null)) api.done(S.reduce((a, x) => a + x.pts, 0) / S.length);
    } else {
      const anyPing = res.out.some((o) => o.r.ping), anyFail = res.out.some((o) => o.r.fail);
      s.fb = `<span class="verdict">Not clean yet (attempt ${s.tries}).</span><p>${anyPing ? 'Ping-pong means the trigger is too eager: shadow fading makes the two cells swap places for a moment. Raise hysteresis or time-to-trigger. ' : ''}${anyFail ? 'A failure means the trigger is too slow: by the time the command is sent, the serving cell is already too weak to deliver it. Lower hysteresis or time-to-trigger, especially at high speed.' : ''}</p>`;
      s.cls = 'no';
    }
    render();
  }
  preset();
  render();
};

/* ---------- Doppler calculator ---------- */
MOUNTS.doppler = function (el) {
  const F = [{ id: '0.7', t: '700 MHz' }, { id: '2', t: '2 GHz' }, { id: '3.5', t: '3.5 GHz' }, { id: '5.9', t: '5.9 GHz' }, { id: '28', t: '28 GHz' }];
  let f = '2', v = 250;
  function draw() {
    const fd = (v / 3.6) * (+f * 1e9) / 3e8; const scs = +f >= 24 ? 120 : +f >= 3 ? 30 : 15;
    const tc = fd > 0 ? 0.423 / fd * 1000 : Infinity;
    el.innerHTML = `<div class="ctl"><label for="dp-v">Vehicle speed: <span class="readout">${v} km/h</span></label><input type="range" id="dp-v" min="0" max="500" step="10" value="${v}"></div>
      <div class="ctl"><span class="lbl">Carrier frequency</span>${segButtons('f', F, f)}</div>
      <div class="formula">f<sub>D</sub> = v · f<sub>c</sub> / c = ${round(v / 3.6, 1)} m/s × ${f} GHz / 3×10⁸ m/s = <b>${Math.round(fd).toLocaleString()} Hz</b></div>
      <p class="readout">That is ${round(100 * fd / (scs * 1000), 2)}% of a ${scs} kHz subcarrier spacing. Coherence time ≈ 0.423 / f<sub>D</sub> = ${Number.isFinite(tc) ? round(tc, 2) + ' ms' : '∞'}: the channel must be re-estimated faster than that.</p>`;
    $('#dp-v', el).addEventListener('input', (e) => { v = +e.target.value; draw(); $('#dp-v', el).focus(); });
    $$('.segbtn', el).forEach((b) => b.addEventListener('click', () => { f = b.dataset.v; draw(); }));
  }
  draw();
};

/* ---------- NR numerology explorer ---------- */
MOUNTS.numerology = function (el) {
  const BWMAX = ['50 MHz (270 RBs), FR1', '100 MHz (273 RBs), FR1', '100 MHz in FR1 (135 RBs) or 200 MHz in FR2 (264 RBs)', '400 MHz (264 RBs), FR2', 'SSB only (not for data in Rel-15/16)'];
  let mu = 1;
  function draw() {
    const scs = 15 * 2 ** mu, sym = 1000 / scs, cp = 4.69 / 2 ** mu, slot = 1 / 2 ** mu, n = 2 ** mu;
    const W = 520, gx = 10, gw = 500, y = 26;
    let s = `<svg class="dg" viewBox="0 0 ${W} 92" role="img" aria-label="One millisecond subframe split into ${n} slots">`;
    s += `<text class="t-sm t-mute" x="${gx}" y="14">1 ms subframe = ${n} slot${n > 1 ? 's' : ''} × 14 OFDM symbols</text>`;
    for (let k = 0; k < n; k++) {
      const x = gx + k * gw / n, w = gw / n;
      s += `<rect class="box ran" x="${x + 1}" y="${y}" width="${w - 2}" height="34" rx="3"/>`;
      if (n <= 8) for (let j = 1; j < 14; j++) s += `<line class="stroke-mute" x1="${x + j * w / 14}" x2="${x + j * w / 14}" y1="${y + 4}" y2="${y + 30}" stroke-width=".7"/>`;
      if (n <= 4) s += `<text class="t-sm" x="${x + w / 2}" y="${y + 52}" text-anchor="middle">slot ${k} · ${slot} ms</text>`;
    }
    if (n > 4) s += `<text class="t-sm" x="${gx + gw / 2}" y="${y + 52}" text-anchor="middle">${n} slots of ${slot * 1000} µs each</text>`;
    s += '</svg>';
    el.innerHTML = `<div class="ctl"><label for="nu">Numerology μ = <span class="readout">${mu}</span></label><input type="range" id="nu" min="0" max="4" step="1" value="${mu}"></div>${s}
      <div class="tbl-wrap"><table class="tbl"><tbody>
        <tr><td>Subcarrier spacing 15·2<sup>μ</sup></td><td class="n">${scs} kHz</td></tr>
        <tr><td>Useful symbol length 1/Δf</td><td class="n">${round(sym, 2)} µs</td></tr>
        <tr><td>Normal cyclic prefix (approx.)</td><td class="n">${round(cp, 2)} µs</td></tr>
        <tr><td>Slot length (14 symbols)</td><td class="n">${slot * 1000} µs</td></tr>
        <tr><td>Slots per 10 ms frame</td><td class="n">${10 * n}</td></tr>
        <tr><td>Widest carrier</td><td>${BWMAX[mu]}</td></tr></tbody></table></div>`;
    $('#nu', el).addEventListener('input', (e) => { mu = +e.target.value; draw(); $('#nu', el).focus(); });
  }
  draw();
};

  'AMBR': ['Aggregate Maximum Bit Rate', 'A cap on the total bit rate of all non-GBR bearers of a UE (UE-AMBR) or of one APN (APN-AMBR). Rel-14 also added a UE PC5 AMBR for the sidelink.'],
  'AMF': ['Access and Mobility Management Function', 'The 5G core function that terminates NAS signalling (N1), handles registration, reachability and mobility. It takes over the mobility half of the LTE [[MME]].'],
  'ARP': ['Allocation and Retention Priority', 'A bearer QoS parameter that decides who gets admitted or pre-empted when the network is congested.'],
  'AUTN': ['Authentication token', 'Part of the AKA challenge. It carries the sequence number (masked), and a MAC that lets the USIM check the challenge really came from its home network and is fresh.'],
  'BLER': ['Block error rate', 'The fraction of transport blocks that fail their CRC on the first try. LTE link adaptation usually aims at about 10%, and [[HARQ]] fixes the rest.'],

  'BWP': ['Bandwidth part', 'In NR, a contiguous slice of a wide carrier with its own numerology. A UE is active on one BWP at a time, which saves power and supports mixed devices.'],
  'C-RNTI': ['Cell Radio Network Temporary Identifier', 'A 16-bit identity the eNB assigns to a connected UE. DCIs for that UE are marked with it (it scrambles the PDCCH CRC).'],

      body: `<p class="lead">Everything a vehicle sends over Uu passes through a handful of network functions. Each has one job.</p>
        <ul><li><b>[[eNB]]</b>: the base station. Runs the radio, schedules every millisecond, decides handovers.</li>
        <li><b>[[MME]]</b>: the control brain of the core. Authenticates the car, tracks where it is, sets up its bearers. Your data packets do not pass through it.</li>
        <li><b>[[S-GW]]</b>: the user-plane anchor. When the car moves to a new eNB, the S-GW simply switches its downlink tunnel to the new eNB; the P-GW and the car's IP address stay the same.</li>
        <li><b>[[P-GW]]</b>: the door to IP networks. Gives the car its IP address and applies policy.</li>
        <li><b>[[HSS]]</b>: the subscriber database, including whether this SIM may use V2X.</li>
        <li><b>[[PCRF]]</b>: decides the QoS and charging rules for each flow.</li></ul>
        <p class="analogy">Think of an airport: the MME is the control tower, the S-GW the local terminal you can switch gates in, the P-GW the international gateway, and the HSS the passport office.</p>`,
      takeaway: 'Radio = eNB. Core control = MME (+HSS, PCRF). Core user plane = S-GW → P-GW.',
      detail: `<p>Together these form the Evolved Packet System (EPS): E-UTRAN (the eNBs) plus the [[EPC]]. Rel-14 [[CUPS]] split S-GW and P-GW into control (SGW-C, PGW-C) and user (SGW-U, PGW-U) parts, so a user-plane gateway can sit at the network edge next to the cells; this is one way operators shorten the V2X latency path.</p>`,
      specs: ['TS 23.401', 'TS 36.300 §4'],

        <li><b>New: [[V2X AS]] (V2X Application Server)</b>. Receives V2X messages that cars upload over Uu, works out which area needs them, and sends them back down by unicast or broadcast.</li>
        <li><b>Reused: MBMS broadcast</b> (Rel-9 eMBMS, plus Rel-13 SC-PTM). The [[BM-SC]] and [[MBMS-GW]] in the core and the [[MCE]] in the radio network (usually built into the eNB) let the network send one copy of a message to every car in an area instead of one copy per car. Rel-14 tuned it for V2X, for example with shorter broadcast scheduling periods (Exit 8).</li></ul>
        <p>The two new functions sit beside the core, and the car reaches them over ordinary IP.</p>`,

        <p>In 5G (TS 23.287) the V2X Control Function disappears: its provisioning role moves into the [[PCF]].</p>`,

        <p><b>Control plane</b> is signalling: "let me in", "here are your keys", "move to that cell", "set up a bearer". It runs [[RRC]] between car and eNB and [[NAS]] between car and MME, then S1-AP, GTP-C and Diameter inside the core.</p>

  id: 3, num: '3', title: 'The Stack', subtitle: 'Protocol layers on the Uu interface', mins: 18,
  topics: ['PDCP · RLC · MAC · PHY', 'RRC · NAS', 'ROHC · ARQ · HARQ', 'Encapsulation'],
  cards: [
    {
      title: 'Where each layer lives',
      wide: true,
      body: `<p class="lead">A V2X message passes down a stack of layers in the car, across the air, and up and down more stacks in the network. Each layer adds one service.</p>
        <p>On the <b>user plane</b> the V2X message rides UDP and IP all the way to the V2X AS. Below IP, the radio layers ([[PDCP]], [[RLC]], [[MAC]], [[PHY]]) only exist between the car and the eNB. From the eNB onward the IP packet is wrapped in a [[GTP-U]] tunnel over ordinary transport networks.</p>
        <p>The diagram reads left to right as the path of one uplink message.</p>`,
      fig: `<div class="scroll-x">${stackSVG([
        { name: 'UE', layers: [{ t: 'V2X message', kind: 'v2x' }, { t: 'UDP', kind: 'ue' }, { t: 'IP', kind: 'ue' }, { t: 'PDCP', kind: 'ran' }, { t: 'RLC', kind: 'ran' }, { t: 'MAC', kind: 'ran' }, { t: 'PHY', kind: 'core' }] },

      detail: `<p>Over Uu, V2X messages are IP traffic (IPv4 or IPv6, normally UDP). This differs from PC5, where LTE-V2X also supports non-IP messages such as IEEE 1609.3 WSMP directly over PDCP.</p>
        <p>The control plane has the same radio layers, with [[RRC]] on top (ending in the eNB) and [[NAS]] on top of that (ending in the MME). See the control-plane stack in Exit 2.</p>`,
